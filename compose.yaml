services:
  database:
    image: postgis/postgis:18-3.6
    # ponytail: AMD64 emulation on Apple Silicon; use an ARM64 image for native performance.
    platform: linux/amd64
    environment:
      POSTGRES_DB: tennisconnect
      POSTGRES_USER: tennisconnect
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 moved its data directory to /var/lib/postgresql/<major>/docker
      # and now requires the mount one level up; mounting the old
      # /var/lib/postgresql/data path leaves an empty PGDATA and the entrypoint
      # refuses to start, because it finds no PG_VERSION where it expects one.
      - database-data:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennisconnect -d tennisconnect"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  database-data:

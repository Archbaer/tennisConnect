version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR for the AWS SDK family: these modules must move together or the
      # build breaks, and individual PRs would each fail CI on their own.
      aws-sdk:
        patterns:
          - "github.com/aws/*"
      go-x:
        patterns:
          - "golang.org/x/*"
      patch-and-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      # Actions are pinned to full commit SHAs; bumping them one PR at a time
      # costs a review each, so batch them.
      actions:
        patterns:
          - "*"

  # docker-compose, not docker: this repo has compose.yaml and no Dockerfile.
  # The `docker` ecosystem only scans Dockerfiles, so it silently found nothing.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"

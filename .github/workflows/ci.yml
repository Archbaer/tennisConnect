name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgres://tennisconnect:local-development-only@localhost:5432/tennisconnect_test?sslmode=disable
    services:
      database:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: tennisconnect_test
          POSTGRES_USER: tennisconnect
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tennisconnect -d tennisconnect_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf 'Unformatted files:\n%s\n' "$files"
            exit 1
          fi

      - name: Lint
        run: go vet ./...

      # Repeat + shuffle per plan.md: a single pass cannot expose order or
      # isolation dependence between packages sharing one test database.
      - name: Test
        run: go test -race -count=2 -shuffle=on ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config=.github/golangci.yml --timeout=5m

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Check for whitespace errors
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_REF}" ]]; then
            base="$(git merge-base HEAD "origin/${BASE_REF}")"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            base="${BEFORE_SHA}"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          echo "checking whitespace from ${base} to HEAD"
          git diff --check "${base}" HEAD

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Single job rather than a matrix: one stable required-check name and one
      # shared module cache for all four targets.
      - name: Cross-compile
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            echo "building ${target}"
            go build ./...
          done

  test-nodb:
    name: test-nodb
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No database service: proves the suite still passes when TEST_DATABASE_URL
    # is unset, so no package can acquire a hard dependency on a live database.
    env:
      TEST_DATABASE_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test without a database
        run: go test ./...

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      database:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: tennisconnect_test
          POSTGRES_USER: tennisconnect
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tennisconnect -d tennisconnect_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Migrations wrap themselves in BEGIN/COMMIT, so they are applied with
      # ON_ERROR_STOP only (--single-transaction would nest transactions and
      # commit at the file's own COMMIT). Each run starts from a dropped schema.
      - name: Apply migrations from an empty database, twice
        shell: bash
        env:
          PGPASSWORD: local-development-only
        run: |
          set -euo pipefail
          apply() {
            for file in migrations/*.sql; do
              echo "applying ${file}"
              psql --host=localhost --username=tennisconnect --dbname=tennisconnect_test \
                -v ON_ERROR_STOP=1 -q -f "$file"
            done
          }
          # Assert the exact table set, not a count. A count cannot fail for the
          # reason this job exists: PostGIS installs spatial_ref_sys plus two
          # geometry_columns/geography_columns views, so a dropped migration can
          # be masked by the extension's own objects and still clear a threshold
          # (deleting 000005_locations.sql still yields 10 tables >= 10).
          # A set derived at runtime from `grep CREATE TABLE` would shrink with
          # the deleted file and pass just as easily, so this list is hardcoded:
          # it must be updated deliberately when a migration adds a table.
          expected="auth_rate_limits availability locations login_tokens photos profiles sessions spatial_ref_sys users"
          for pass in 1 2; do
            echo "::group::migration pass ${pass}"
            psql --host=localhost --username=tennisconnect --dbname=tennisconnect_test \
              -v ON_ERROR_STOP=1 -q \
              -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
            apply
            # pg_tables holds real tables; information_schema.tables also counts
            # the PostGIS views, which is why the two counts differ.
            actual="$(psql --host=localhost --username=tennisconnect --dbname=tennisconnect_test \
              -v ON_ERROR_STOP=1 -tA \
              -c "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename" \
              | tr '\n' ' ' | sed 's/ *$//')"
            echo "tables after pass ${pass}: ${actual}"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "table set mismatch on pass ${pass}"
              echo "  expected: ${expected}"
              echo "  actual:   ${actual}"
              exit 1
            fi
            psql --host=localhost --username=tennisconnect --dbname=tennisconnect_test \
              -v ON_ERROR_STOP=1 -tA \
              -c "SELECT postgis_version();"
            echo "::endgroup::"
          done

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Run govulncheck directly instead of via golang/govulncheck-action.
      # The action resolves its own `stable` toolchain, so the scan used to run
      # on whatever Go happened to be newest (1.27.x) rather than the version
      # this repo declares. That made the result meaningless for this project:
      # it reported "No vulnerabilities found" while the project's own toolchain
      # reported reachable standard-library vulnerabilities, and the scan could
      # change or break with no repo change at all.
      # Here setup-go provisions the toolchain from go.mod (respecting the
      # `toolchain` directive), and the scanner version is pinned so the job is
      # reproducible.
      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgres://tennisconnect:local-development-only@localhost:5432/tennisconnect_test?sslmode=disable
    services:
      database:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: tennisconnect_test
          POSTGRES_USER: tennisconnect
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tennisconnect -d tennisconnect_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf 'Unformatted files:\n%s\n' "$files"
            exit 1
          fi

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-package: ./...
          repo-checkout: false
